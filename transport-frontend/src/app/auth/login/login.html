<div class="min-h-screen flex flex-col items-center justify-center px-4 py-10 font-sans bg-gradient-to-br from-slate-50 via-blue-50 to-slate-100">

  <!-- Brand -->
  <div class="flex flex-col items-center gap-2 mb-7 select-none">
    <div class="w-14 h-14 rounded-2xl bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-600/25">
      <span class="material-symbols-outlined text-white text-[30px]">local_shipping</span>
    </div>
    <div class="text-center">
      <h1 class="text-xl font-bold tracking-tight text-slate-900 leading-none">FleetFlow ERP</h1>
      <p class="text-xs text-slate-500 mt-1">Transport Management System</p>
    </div>
  </div>

  <!-- Login card -->
  <div class="w-full max-w-sm bg-white rounded-2xl border border-slate-200/70 shadow-[0_10px_40px_-12px_rgba(15,23,42,0.18)] p-7 sm:p-8 flex flex-col gap-6">

    <div class="text-center">
      <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Welcome back</h2>
      <p class="text-sm text-slate-500 mt-1.5">Sign in to continue to your dashboard</p>
    </div>

    @if (errorMessage()) {
      <div class="p-3 bg-rose-50 border border-rose-100 rounded-lg text-xs font-semibold text-rose-600 flex items-center gap-2.5">
        <span class="material-symbols-outlined text-base">report</span>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-slate-700">Username</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">person</span>
          <input
            type="text"
            formControlName="username"
            placeholder="Enter your username"
            class="w-full h-12 pl-11 pr-4 border border-slate-200 rounded-xl text-slate-800 text-sm placeholder:text-slate-400 bg-slate-50/60 focus:bg-white focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition" />
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-slate-700">Password</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">lock</span>
          <input
            [type]="hidePassword() ? 'password' : 'text'"
            formControlName="password"
            placeholder="Enter your password"
            class="w-full h-12 pl-11 pr-11 border border-slate-200 rounded-xl text-slate-800 text-sm placeholder:text-slate-400 bg-slate-50/60 focus:bg-white focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition" />
          <button
            type="button"
            (click)="hidePassword.set(!hidePassword())"
            class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 focus:outline-none cursor-pointer">
            <span class="material-symbols-outlined text-[20px]">{{ hidePassword() ? 'visibility' : 'visibility_off' }}</span>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between select-none">
        <label for="remember" class="flex items-center gap-2 cursor-pointer">
          <input
            type="checkbox"
            id="remember"
            class="rounded border-slate-300 text-blue-600 focus:ring-blue-500 w-4 h-4 cursor-pointer" />
          <span class="text-sm text-slate-600">Remember me</span>
        </label>
        <a routerLink="/forgot-password" class="text-sm font-semibold text-blue-600 hover:text-blue-700 transition">Forgot password?</a>
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid || loading()"
        class="w-full h-12 mt-1 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:shadow-none disabled:cursor-not-allowed text-white text-sm font-semibold rounded-xl shadow-lg shadow-blue-600/20 hover:shadow-blue-600/30 transition flex items-center justify-center gap-2 cursor-pointer">
        @if (loading()) {
          <span class="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"></span>
          Signing in...
        } @else {
          <span>Sign In</span>
          <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
        }
      </button>

    </form>
  </div>

  <p class="mt-6 text-xs text-slate-400 select-none">&copy; 2024 FleetFlow ERP &nbsp;•&nbsp; v1.0.0</p>

</div>
