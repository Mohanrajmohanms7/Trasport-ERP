@if (isVisible()) {
  <div
    class="ff-field"
    [class]="sizeClass()"
    [class.ff-field--error]="hasError()"
    [class.ff-field--disabled]="isDisabled()"
    [attr.title]="displayTooltip() || null">

    @if (displayLabel()) {
      <label class="ff-field__label" [attr.for]="inputId()">
        {{ displayLabel() }}
        @if (isRequired()) {
          <span class="ff-field__required" aria-hidden="true">*</span>
        }
      </label>
    }

    @if (skeleton()) {
      <div class="ff-field__skeleton ff-skeleton" aria-hidden="true"></div>
    } @else {
      <div class="ff-field__control">
        @if (prefixIcon()) {
          <span class="ff-field__icon ff-field__icon--prefix material-symbols-outlined" aria-hidden="true">
            {{ prefixIcon() }}
          </span>
        } @else {
          <span class="ff-field__icon ff-field__icon--prefix material-symbols-outlined" aria-hidden="true">lock</span>
        }

        <input
          class="ff-field__input ff-field__input--with-prefix ff-field__input--with-suffix"
          [id]="inputId()"
          [type]="showToggle() ? 'text' : 'password'"
          [attr.placeholder]="placeholder() || 'Enter password'"
          [attr.aria-invalid]="hasError()"
          [attr.aria-required]="isRequired()"
          [value]="value() ?? ''"
          [disabled]="isDisabled()"
          [readOnly]="isReadonly()"
          autocomplete="current-password"
          (input)="onInput($event)"
          (focus)="onFocus()"
          (blur)="onBlur()" />

        <button
          type="button"
          class="ff-field__icon ff-field__icon--suffix"
          [attr.aria-label]="showToggle() ? 'Hide password' : 'Show password'"
          [disabled]="isDisabled()"
          (click)="toggleVisibility()">
          <span class="material-symbols-outlined">
            {{ showToggle() ? 'visibility_off' : 'visibility' }}
          </span>
        </button>
      </div>
    }

    @if (hint() && !hasError()) {
      <p class="ff-field__hint">{{ hint() }}</p>
    }
    @if (hasError()) {
      <p class="ff-field__error" role="alert">{{ errorMessage() }}</p>
    }
  </div>
}
