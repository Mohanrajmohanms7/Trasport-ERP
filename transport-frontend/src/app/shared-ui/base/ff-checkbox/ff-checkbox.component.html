@if (isVisible()) {
  <div
    class="ff-field"
    [class.ff-field--error]="hasError()"
    [class.ff-field--disabled]="isDisabled()"
    [attr.title]="displayTooltip() || null">

    <label
      class="ff-check"
      [class.ff-check--disabled]="isDisabled()"
      [attr.for]="inputId()">
      <input
        class="ff-check__input"
        type="checkbox"
        [id]="inputId()"
        [checked]="!!value()"
        [disabled]="isDisabled()"
        [attr.aria-invalid]="hasError()"
        [attr.aria-required]="isRequired()"
        (change)="onToggle($event)"
        (blur)="onBlur()" />
      <span class="ff-check__label">
        {{ displayLabel() }}
        @if (isRequired()) {
          <span class="ff-field__required" aria-hidden="true">*</span>
        }
      </span>
    </label>

    @if (hint() && !hasError()) {
      <p class="ff-field__hint">{{ hint() }}</p>
    }
    @if (hasError()) {
      <p class="ff-field__error" role="alert">{{ errorMessage() }}</p>
    }
  </div>
}
