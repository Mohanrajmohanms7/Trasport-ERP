<div class="ops-page">
  <div>
    <h1 class="ops-title">{{ id() ? 'Edit warehouse' : 'New warehouse' }}</h1>
    <p class="ops-sub">A warehouse belongs to one company branch and cannot be moved later.</p>
  </div>

  @if (error()) {
    <div class="ops-alert ops-alert--error">{{ error() }}</div>
  }

  <form class="ops-card ops-form max-w-3xl" (ngSubmit)="save()">
    <label class="ops-field">Code
      <input class="ops-input" [ngModel]="code()" (ngModelChange)="code.set($event)" name="code" />
    </label>
    <label class="ops-field">Name
      <input class="ops-input" [ngModel]="name()" (ngModelChange)="name.set($event)" name="name" />
    </label>
    <label class="ops-field span-all">Description
      <input class="ops-input" [ngModel]="description()" (ngModelChange)="description.set($event)" name="description" />
    </label>
    <label class="ops-field">Branch
      <select class="ops-input" [ngModel]="branchId()" (ngModelChange)="branchId.set($event)" name="branch" [disabled]="branchLocked() || !!id()">
      <option value="">Select…</option>
      @for (branch of branches(); track branch.id) {
        <option [value]="branch.id">{{ branch.code }} — {{ branch.name }}</option>
      }
    </select>
    </label>
    <select class="ops-input" [ngModel]="status()" (ngModelChange)="status.set($event)" name="status">
      <option value="ACTIVE">Active</option>
      <option value="INACTIVE">Inactive</option>
    </select>
    <button type="submit" class="ops-btn ops-btn--dark">Save</button>
  </form>
</div>
