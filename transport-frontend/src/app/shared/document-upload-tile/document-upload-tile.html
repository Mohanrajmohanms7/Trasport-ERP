<div class="bg-white border border-slate-200 rounded-xl p-4 flex flex-col items-center justify-center text-center shadow-sm select-none hover:border-blue-300 transition duration-150 relative group">
  <!-- Document Icon inside Circle -->
  <div [class]="bgIconClass" class="w-10 h-10 rounded-full flex items-center justify-center mb-2 shrink-0">
    <span class="material-symbols-outlined text-lg">{{ icon }}</span>
  </div>
  
  <!-- Doc Name -->
  <span class="text-xs font-bold text-slate-800 leading-tight">{{ label }}</span>
  
  <!-- File State Display -->
  @if (fileState) {
    <span class="text-[9px] text-emerald-600 font-semibold mt-1 truncate max-w-full px-2">✓ {{ fileState }}</span>
  } @else {
    <span class="text-[9px] text-slate-400 font-medium mt-1">No file chosen</span>
  }

  <!-- Action Upload Button -->
  <button (click)="triggerUpload()" 
          class="mt-3 flex items-center gap-1 px-3 py-1.5 border border-slate-200 rounded-lg text-[10px] font-bold text-slate-600 bg-slate-50 hover:bg-blue-600 hover:text-white hover:border-blue-600 transition-all duration-150 cursor-pointer">
    <span class="material-symbols-outlined text-[12px] font-bold">upload</span>
    Upload
  </button>
</div>
