<!-- Backdrop Overlay -->
@if (isOpen) {
  <div (click)="closeDrawer()" 
       class="fixed inset-0 bg-slate-900/30 backdrop-blur-xs z-50 transition-opacity duration-300">
  </div>
}

<!-- Drawer Panel Wrapper -->
<div [class]="isOpen ? 'translate-x-0' : 'translate-x-full'" 
     class="fixed right-0 top-0 bottom-0 w-full max-w-md bg-white border-l border-slate-200 shadow-2xl flex flex-col z-50 transition-transform duration-300 ease-in-out">
  
  <!-- Drawer Header Section -->
  <div class="p-5 border-b border-slate-100 flex items-start justify-between select-none">
    <div class="flex flex-col min-w-0">
      <h2 class="text-base font-bold text-slate-800 truncate">{{ title }}</h2>
      @if (subTitle) {
        <span class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-wider truncate">{{ subTitle }}</span>
      }
    </div>
    
    <!-- Close button -->
    <button (click)="closeDrawer()" 
            class="p-1 text-slate-450 hover:text-slate-850 hover:bg-slate-50 rounded-lg transition duration-150 cursor-pointer">
      <span class="material-symbols-outlined text-lg">close</span>
    </button>
  </div>

  <!-- Drawer Tab Bar Section -->
  @if (tabs && tabs.length > 0) {
    <div class="px-5 border-b border-slate-100 bg-slate-50/50 flex gap-4 select-none">
      @for (tab of tabs; track tab) {
        <button (click)="selectTab(tab)" 
                [class]="activeTab === tab ? 'border-blue-600 text-blue-600 font-bold' : 'border-transparent text-slate-500 hover:text-slate-900 font-medium'"
                class="py-2.5 text-xs border-b-2 transition duration-150 cursor-pointer">
          {{ tab }}
        </button>
      }
    </div>
  }

  <!-- Drawer Scrollable Body Content -->
  <div class="flex-1 overflow-y-auto p-5">
    <ng-content></ng-content>
  </div>

  <!-- Drawer Footer Actions -->
  <div class="p-5 border-t border-slate-100 bg-slate-50 flex flex-col gap-2">
    <ng-content select="[footer]"></ng-content>
  </div>

</div>
