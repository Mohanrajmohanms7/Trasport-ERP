<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d2b40"/><stop offset="1" stop-color="#0d1520"/></linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.42" r="0.6"><stop offset="0" stop-color="#f5a524" stop-opacity="0.22"/><stop offset="1" stop-color="#f5a524" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bn)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <!-- haul road sweeping across -->
  <path d="M-40 760 C 380 700 620 560 900 560 C 1180 560 1320 470 1660 300" fill="none" stroke="#f5a524" stroke-opacity="0.16" stroke-width="90" stroke-linecap="round"/>
