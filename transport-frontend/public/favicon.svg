<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TransaFlow">
  <defs>
    <linearGradient id="tf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22324a"/>
      <stop offset="1" stop-color="#121b28"/>
    </linearGradient>
    <linearGradient id="tf-amber" gradientUnits="userSpaceOnUse" x1="12" y1="14" x2="54" y2="56">
      <stop offset="0" stop-color="#ffc24d"/>
      <stop offset="1" stop-color="#f08c00"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#tf-bg)"/>
  <!-- T: top bar is a haul road, the stem flows down and out to the delivery site -->
  <path d="M13 19.5 H51" stroke="url(#tf-amber)" stroke-width="8" stroke-linecap="round"/>
  <path d="M32 20 V35 C32 43.5 37 47.5 45 47.5 H47" fill="none" stroke="url(#tf-amber)" stroke-width="8" stroke-linecap="round"/>
  <path d="M45.5 40.5 L53 47.5 L45.5 54.5" fill="none" stroke="url(#tf-amber)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- lane markings -->
  <path d="M18 19.5 H46" stroke="#172231" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round"/>
  <path d="M32 24 V35 C32 41 35.5 44 41 44.5" fill="none" stroke="#172231" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round"/>
</svg>
