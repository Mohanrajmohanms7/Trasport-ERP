version: "1"

services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: transport-backend
    runtime: docker
    rootDir: transport-backend
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Database: Neon (free PostgreSQL, no expiry). Set these three in the Render dashboard (Environment):
      #   DATABASE_URL      = jdbc:postgresql://<neon direct host, without -pooler>/<db>?sslmode=require
      #   DATABASE_USERNAME = <neon user>
      #   DATABASE_PASSWORD = <neon password>
      # sync: false = Render keeps the dashboard values and never overwrites them on a blueprint sync.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateWith: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: APP_BOOTSTRAP_ENABLED
        value: "true"
      - key: APP_BOOTSTRAP_ADMIN_PASSWORD
        generateWith: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://transport-frontend.onrender.com

  # 2. Angular Frontend Static Site
  - type: web
    name: transport-frontend
    runtime: static
    buildCommand: cd transport-frontend && npm install && npm run build
    staticPublishPath: ./transport-frontend/dist/transport-frontend/browser
    routes:
      - type: rewrite
        source: /api/*
        destination: https://transport-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 3. PostgreSQL Database Service — the old free Render database (expires after 30 days). No longer used by the
  #    backend once DATABASE_URL points to Neon; delete it in the Render dashboard after the move, then remove this block.
  - name: transport-db
    databaseName: transport_erp
    user: transport_admin
    plan: free
