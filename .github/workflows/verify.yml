name: verify
on:
  push:
    branches: ['ci/verify-**', 'ci/screens', 'ci/audit', 'ci/ui-**']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: transport_erp
          POSTGRES_USER: transport_admin
          POSTGRES_PASSWORD: ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U transport_admin" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Backend test + package
        id: be
        continue-on-error: true
        working-directory: transport-backend
        run: |
          set -o pipefail
          chmod +x mvnw
          ./mvnw -B -q package 2>&1 | tee /tmp/be.log
      - name: Boot against Postgres (Flyway + ddl validate) and smoke
        id: boot
        continue-on-error: true
        working-directory: transport-backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/transport_erp
          SPRING_DATASOURCE_USERNAME: transport_admin
          SPRING_DATASOURCE_PASSWORD: ci_password
          APP_BOOTSTRAP_ENABLED: 'true'
          APP_BOOTSTRAP_ADMIN_PASSWORD: Admin@123
          LOGGING_LEVEL_ORG_HIBERNATE_SQL: WARN
          LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL_BASICBINDER: WARN
          SPRING_JPA_SHOW_SQL: 'false'
        run: |
          set -o pipefail
          java -jar target/*.jar > /tmp/app.log 2>&1 &
          for i in $(seq 1 90); do
            if grep -q "Started TransportBackendApplication" /tmp/app.log; then echo BOOT_OK; break; fi
            if ! kill -0 $! 2>/dev/null; then echo BOOT_DIED; break; fi
            sleep 2
          done
          grep -q "Started TransportBackendApplication" /tmp/app.log || { tail -80 /tmp/app.log > /tmp/boot.log; exit 1; }
          echo "boot ok" > /tmp/boot.log
          if [ -f ../.ci/smoke.sh ]; then bash ../.ci/smoke.sh 2>&1 | tee -a /tmp/boot.log; fi
      - name: Frontend build
        id: fe
        continue-on-error: true
        working-directory: transport-frontend
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund > /tmp/fe.log 2>&1
          npx ng build 2>&1 | tee -a /tmp/fe.log
      - name: Screenshots
        id: shots
        continue-on-error: true
        run: |
          exec > >(tee /tmp/shots.log) 2>&1
          set -x
          cd transport-frontend
          (npx ng serve --proxy-config proxy.conf.json --port 4200 > /tmp/ngserve.log 2>&1 &)
          for i in $(seq 1 120); do curl -s localhost:4200 >/dev/null && break; sleep 3; done
          cd .. && mkdir -p shots /tmp/pw && cp .ci/shots.mjs /tmp/pw/ && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1 2>&1 | tail -3 && npx playwright install --with-deps chromium 2>&1 | tail -3
          ROUTES="$(cat $GITHUB_WORKSPACE/.ci/routes.txt 2>/dev/null || echo driver-payroll)" node shots.mjs 2>&1 | grep -v '^+' | head -60
          cd $GITHUB_WORKSPACE && mv /tmp/pw/shots/* shots/ 2>/dev/null; ls -la shots
          git config user.name ci && git config user.email ci@example.com
          git checkout --orphan ci/screens-out && git rm -rqf --cached . && git add shots && git commit -qm shots && git push -f origin HEAD:${GITHUB_REF_NAME}-out
      - name: Report
        if: always()
        uses: actions/github-script@v7
        env:
          BE: ${{ steps.be.outcome }}
          BOOT: ${{ steps.boot.outcome }}
          FE: ${{ steps.fe.outcome }}
        with:
          script: |
            const fs = require('fs');
            const tail = (f, n) => { try { const l = fs.readFileSync(f,'utf8').split('\n'); return l.slice(-n).join('\n'); } catch { return '(no log)'; } };
            const errs = (f) => { try { return fs.readFileSync(f,'utf8').split('\n').filter(x => /✘|ERROR|error TS|FAIL|Tests run:.*Fail|COMPILATION|cannot find symbol|symbol:|location:/.test(x)).slice(0,120).join('\n'); } catch { return ''; } };
            const body = `BE=${process.env.BE} BOOT=${process.env.BOOT} FE=${process.env.FE}\n\n### backend errors\n\`\`\`\n${errs('/tmp/be.log')}\n\`\`\`\n### backend tail\n\`\`\`\n${tail('/tmp/be.log',60)}\n\`\`\`\n### boot/smoke\n\`\`\`\n${tail("/tmp/boot.log",200)}\n\`\`\`\n### shots\n\`\`\`\n${tail('/tmp/shots.log',60)}\n${tail('/tmp/ngserve.log',15)}\n\`\`\`\n### frontend errors\n\`\`\`\n${errs('/tmp/fe.log')}\n\`\`\`\n### frontend tail\n\`\`\`\n${tail('/tmp/fe.log',30)}\n\`\`\``;
            await github.rest.repos.createCommitComment({ owner: context.repo.owner, repo: context.repo.repo, commit_sha: context.sha, body: body.slice(0, 60000) });
