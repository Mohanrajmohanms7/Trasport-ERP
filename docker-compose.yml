services:
  postgres:
    image: postgres:16-alpine
    container_name: transport-postgres
    environment:
      POSTGRES_DB: transport_erp
      POSTGRES_USER: transport_admin
      POSTGRES_PASSWORD: AdminPass123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transport_admin -d transport_erp"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./transport-backend
    container_name: transport-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/transport_erp
      DATABASE_USERNAME: transport_admin
      DATABASE_PASSWORD: AdminPass123
      APP_BOOTSTRAP_ENABLED: "true"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./transport-frontend
    container_name: transport-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  postgres-data:
